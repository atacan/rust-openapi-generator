[package]
name = "kitchen-sink"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lints.rust]
unsafe_code = "forbid"

[dependencies]
# Both transport halves of the generated API (§3 feature shape); the
# generated code is include!d into this lib unmodified, so these mirror the
# emitted manifest's dependency set minus the codec crates (all OFF here,
# main spec §45).
openapi-support = { path = "../../crates/support", features = ["client", "server"] }
async-trait = { workspace = true }
axum = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
mime = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt-multi-thread"] }
tokio-util = { workspace = true }
futures-core = { workspace = true }
futures-util = { workspace = true }

[[bin]]
name = "kitchen-sink-server"
path = "server/main.rs"

[[bin]]
name = "kitchen-sink-client"
path = "client/main.rs"

[dev-dependencies]
openapi-to-rust-generator = { path = "../../crates/generator" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

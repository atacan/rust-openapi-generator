[package]
name = "kitchen-sink-client"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lints.rust]
unsafe_code = "forbid"

[dependencies]
# The generated client consumes the SHARED models crate (`--types-path
# kitchen_sink_models`) and only the client-side transport stack.
kitchen-sink-models = { path = "../models" }
openapi-support = { path = "../../../crates/support", features = ["client"] }
bytes = { workspace = true }
futures-core = { workspace = true }
futures-util = { workspace = true }
http = { workspace = true }
mime = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt-multi-thread"] }
tokio-util = { workspace = true }

[[bin]]
name = "kitchen-sink-client"
path = "src/main.rs"

[dev-dependencies]
# Smoke test only: it spawns the server crate's demo router over real TCP.
axum = { workspace = true }
kitchen-sink-server = { path = "../server" }
tokio = { workspace = true, features = ["net"] }

[package]
name = "kitchen-sink-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lints.rust]
unsafe_code = "forbid"

[dependencies]
# The generated server consumes the SHARED models crate (`--types-path
# kitchen_sink_models`) and only the server-side transport stack; reqwest
# never appears in this crate's graph.
kitchen-sink-models = { path = "../models" }
openapi-support = { path = "../../../crates/support", features = ["server"] }
async-trait = { workspace = true }
axum = { workspace = true }
bytes = { workspace = true }
futures-core = { workspace = true }
futures-util = { workspace = true }
http = { workspace = true }
mime = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt-multi-thread"] }
tokio-util = { workspace = true }

[[bin]]
name = "kitchen-sink-server"
path = "src/main.rs"

[package]
name = "large-upload-memmon"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lints.rust]
# `deny` rather than `forbid`: the memory monitor needs ONE getrusage(2) FFI
# call for the kernel high-water-mark RSS; it opts back in with a scoped
# #[allow] + justification (src/lib.rs). Everything else stays unsafe-free.
unsafe_code = "deny"

# Demo-only measurement support shared by BOTH transport crates without
# coupling them to each other: no axum, no reqwest — just tokio time/rt,
# sampled RSS, and one libc call.
[dependencies]
tokio = { workspace = true, features = ["rt", "time"] }
memory-stats = { workspace = true }
libc = { workspace = true }

[package]
name = "large-upload-client"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lints.rust]
unsafe_code = "forbid"

[dependencies]
# The generated client consumes the SHARED models crate (`--types-path
# large_upload_models`) and only the client-side transport stack.
large-upload-models = { path = "../models" }
large-upload-memmon = { path = "../memmon" }
openapi-support = { path = "../../../crates/support", features = ["client"] }
bytes = { workspace = true }
futures-core = { workspace = true }
http = { workspace = true }
mime = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt-multi-thread"] }
tokio-util = { workspace = true }

[[bin]]
name = "large-upload-client"
path = "src/main.rs"

[dev-dependencies]
# Smoke tests only: they spawn the server crate's demo routers over real TCP.
axum = { workspace = true }
large-upload-server = { path = "../server" }
tokio = { workspace = true, features = ["net"] }

[package]
name = "large-upload-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lints.rust]
# `deny` rather than `forbid`: the shared memmon module needs ONE
# getrusage(2) FFI call for the kernel high-water-mark RSS; it opts back in
# with a scoped #[allow] + justification (../../memmon/mod.rs). Everything
# else stays unsafe-free.
unsafe_code = "deny"

[features]
default = []
# PROXY mode (`--proxy-url`) forwards the raw inbound stream through a
# reqwest client. Deliberate OPT-IN: the DEFAULT build — and therefore the
# generated server surface itself — never compiles the client transport
# stack (proven by scripts/check-transport-isolation.sh in CI).
proxy = ["dep:reqwest"]

[dependencies]
# The generated server consumes the SHARED models crate (`--types-path
# large_upload_models`). The demo's PROXY mode reuses reqwest as its
# upstream transport BY CHOICE and only under the `proxy` feature; the
# GENERATED server module itself never needs a client stack (see the
# split-workspace compile proofs in crates/generator).
large-upload-models = { path = "../models" }
openapi-support = { path = "../../../crates/support", features = ["server"] }
async-trait = { workspace = true }
axum = { workspace = true }
futures-core = { workspace = true }
futures-util = { workspace = true }
http = { workspace = true }
libc = { workspace = true }
memory-stats = { workspace = true }
reqwest = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt-multi-thread", "signal", "time"] }

[[bin]]
name = "large-upload-server"
path = "src/main.rs"

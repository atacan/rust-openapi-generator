[package]
name = "large-upload-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lints.rust]
unsafe_code = "forbid"

[dependencies]
# The generated server consumes the SHARED models crate (`--types-path
# large_upload_models`). The demo's PROXY mode reuses reqwest as its
# upstream transport by choice; the GENERATED server module itself needs no
# client stack (see the split-workspace proofs in crates/generator).
large-upload-models = { path = "../models" }
large-upload-memmon = { path = "../memmon" }
openapi-support = { path = "../../../crates/support", features = ["server"] }
async-trait = { workspace = true }
axum = { workspace = true }
futures-core = { workspace = true }
futures-util = { workspace = true }
http = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt-multi-thread", "signal"] }

[[bin]]
name = "large-upload-server"
path = "src/main.rs"

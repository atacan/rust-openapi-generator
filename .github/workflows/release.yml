# Builds and publishes prebuilt oapi-to-rust binaries for stable version
# tags, then notifies atacan/homebrew-tap so its formula can be updated.
#
# Contract with atacan/homebrew-tap (must not drift):
# - archive naming: oapi-to-rust-vVERSION-TARGET.tar.gz, executable at the
#   archive root as `oapi-to-rust`;
# - checksum asset: SHA256SUMS, exactly four entries;
# - dispatch event: oapi_to_rust_release_published, sent to
#   atacan/homebrew-tap with client_payload {version, tag, repository,
#   release_url, source_sha} — the receiver independently re-verifies all of
#   these against the GitHub Release rather than trusting the payload.
#
# macOS: both aarch64-apple-darwin and x86_64-apple-darwin are built on the
# same Apple-silicon runner. Apple's linker cross-links x86_64 Mach-O objects
# natively on arm64 hosts, so this avoids depending on GitHub's x86_64 macOS
# runner label, which is on a deprecation path.

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─── 1. Verify the tag against crate metadata, prepare the release ───────
  prepare:
    name: Verify version and prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      should_build: ${{ steps.existing.outputs.should_build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Resolve the tag and verify it matches the crate version
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::tag '${tag}' is not a stable vMAJOR.MINOR.PATCH tag; not releasing" >&2
            exit 1
          fi
          version="${tag#v}"
          crate_version="$(awk -F'"' '/^version = /{print $2; exit}' crates/generator/Cargo.toml)"
          if [[ "$crate_version" != "$version" ]]; then
            echo "::error::tag ${tag} does not match crates/generator Cargo.toml version ${crate_version}" >&2
            exit 1
          fi
          {
            printf 'version=%s\n' "$version"
            printf 'tag=%s\n' "$tag"
          } >>"$GITHUB_OUTPUT"

      - name: Check whether this release is already published
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.resolve.outputs.tag }}"
          if release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" 2>/dev/null)"; then
            if [[ "$(jq -r .draft <<<"$release_json")" == "false" ]]; then
              echo "Release ${tag} is already published; this is an idempotent rerun." >&2
              echo "should_build=false" >>"$GITHUB_OUTPUT"
              exit 0
            fi
          else
            gh release create "$tag" --draft \
              --title "oapi-to-rust ${tag}" \
              --notes "Prebuilt oapi-to-rust ${{ steps.resolve.outputs.version }} binaries for macOS (Apple Silicon/Intel) and Linux (x86_64/aarch64)."
          fi
          echo "should_build=true" >>"$GITHUB_OUTPUT"

  # ─── 2. Build the four release targets ───────────────────────────────────
  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: release-${{ matrix.target }}

      - name: Build oapi-to-rust
        run: >
          cargo build --release --locked
          --package openapi-to-rust-generator
          --bin oapi-to-rust
          --target ${{ matrix.target }}

      - name: Package the release archive
        shell: bash
        run: |
          set -euo pipefail
          staging="$(mktemp -d)"
          cp "target/${{ matrix.target }}/release/oapi-to-rust" "$staging/oapi-to-rust"
          chmod +x "$staging/oapi-to-rust"
          asset="oapi-to-rust-${TAG}-${{ matrix.target }}.tar.gz"
          tar -czf "$asset" -C "$staging" oapi-to-rust
          echo "ASSET=$asset" >>"$GITHUB_ENV"

      - name: Upload the archive to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${TAG}" "${ASSET}" --clobber

  # ─── 3. Verify the complete asset set, checksum, and publish ─────────────
  finalize:
    name: Verify assets and publish release
    needs: [prepare, build]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      release_url: ${{ steps.publish.outputs.release_url || steps.already.outputs.release_url }}
      source_sha: ${{ steps.publish.outputs.source_sha || steps.already.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Fail if a required target build failed
        if: needs.prepare.outputs.should_build == 'true' && needs.build.result != 'success'
        run: |
          echo "::error::one or more target builds failed; leaving the draft release unpublished" >&2
          exit 1

      - name: Verify the four archives, generate SHA256SUMS, and publish
        id: publish
        if: needs.prepare.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.prepare.outputs.tag }}"
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}")"

          targets=(aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu)
          expected_assets=()
          for t in "${targets[@]}"; do
            expected_assets+=("oapi-to-rust-${tag}-${t}.tar.gz")
          done
          expected="$(printf '%s\n' "${expected_assets[@]}" | LC_ALL=C sort)"
          actual="$(jq -r '.assets[].name' <<<"$release_json" | LC_ALL=C sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::release ${tag} does not have exactly the expected four archives" >&2
            printf 'expected:\n%s\nactual:\n%s\n' "$expected" "$actual" >&2
            exit 1
          fi

          workdir="$(mktemp -d)"
          for asset in "${expected_assets[@]}"; do
            gh release download "$tag" --pattern "$asset" --dir "$workdir"
          done
          (cd "$workdir" && shasum -a 256 -- *.tar.gz | LC_ALL=C sort -k2 >SHA256SUMS)
          test "$(wc -l <"$workdir/SHA256SUMS" | tr -d ' ')" = 4
          gh release upload "$tag" "$workdir/SHA256SUMS" --clobber

          source_sha="$(git rev-parse HEAD)"
          gh release edit "$tag" --draft=false
          release_url="$(gh release view "$tag" --json url --jq .url)"
          {
            printf 'release_url=%s\n' "$release_url"
            printf 'source_sha=%s\n' "$source_sha"
          } >>"$GITHUB_OUTPUT"

      - name: Resolve info for an already-published release
        id: already
        if: needs.prepare.outputs.should_build == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.prepare.outputs.tag }}"
          release_url="$(gh release view "$tag" --json url --jq .url)"
          source_sha="$(git rev-parse HEAD)"
          {
            printf 'release_url=%s\n' "$release_url"
            printf 'source_sha=%s\n' "$source_sha"
          } >>"$GITHUB_OUTPUT"

  # ─── 4. Notify the Homebrew tap ───────────────────────────────────────────
  notify-homebrew:
    name: Notify atacan/homebrew-tap
    needs: [prepare, finalize]
    if: needs.finalize.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send oapi_to_rust_release_published
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_URL: ${{ needs.finalize.outputs.release_url }}
          SOURCE_SHA: ${{ needs.finalize.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "::error::HOMEBREW_TAP_TOKEN secret is not configured; cannot notify atacan/homebrew-tap. \
          See the repository secret requirements documented in the release PR." >&2
            exit 1
          fi
          gh api repos/atacan/homebrew-tap/dispatches \
            --method POST \
            -f event_type=oapi_to_rust_release_published \
            -f "client_payload[version]=${VERSION}" \
            -f "client_payload[tag]=${TAG}" \
            -f "client_payload[repository]=atacan/rust-openapi-generator" \
            -f "client_payload[release_url]=${RELEASE_URL}" \
            -f "client_payload[source_sha]=${SOURCE_SHA}"

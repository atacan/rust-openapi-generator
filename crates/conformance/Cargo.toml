[package]
name = "openapi-conformance"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lints.rust]
unsafe_code = "forbid"

[build-dependencies]
openapi-to-rust-generator = { path = "../generator" }

[dependencies]
# `client-gzip` routes the §30.2 transparent-decompression proof: the gzip
# variant of fixture 01 emits `.gzip(true)`, which only compiles against a
# Reqwest with the matching feature, and the compression round trips drive
# that artifact set (§50 test 32).
openapi-support = { path = "../support", features = ["client", "server", "client-gzip"] }
async-trait = { workspace = true }
axum = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
mime = { workspace = true }
reqwest = { workspace = true, features = ["gzip"] }
futures-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Runtime crates of the §45 codec families: referenced by the CODEC-ENABLED
# fixture-16 artifacts (D-impl-codec-plugins). openapi-support stays
# dependency-light; these live here and in emitted-manifest metadata only.
quick-xml = { workspace = true }
ciborium = { workspace = true }
rmp-serde = { workspace = true }
# Referenced by the generated §17 client (`from_file` streams files through
# tokio-util's ReaderStream); the generated code is included! into this lib.
tokio = { workspace = true, features = ["fs", "io-util"] }
tokio-util = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }
tokio-util = { workspace = true }
tower = { workspace = true }
futures-util = { workspace = true }
# Negative conformance suite (§50 test 38): each fixture under
# tests/compile_fail/ must FAIL to compile, with the committed `.stderr`
# snapshot pinning the exact diagnostic.
trybuild = { workspace = true }

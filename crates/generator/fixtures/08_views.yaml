# Fixture 08 — directional views (companion §5): readOnly/writeOnly markers
# produce <Name>Write / <Name>Read view types while shared models keep every
# field, and the operation codecs consume the directional cut: request
# payloads target <M>Write, response payloads <M>Read. Covers:
#   (a) Account      — required writeOnly password + required directionless id
#                      + optional directionless note (§5 Widget/password rule);
#                      POST /accounts exercises the lossless write view (the
#                      router reconstructs the shared model before the trait);
#   (b) AuditEntry   — required readOnly createdAt + optional writeOnly
#                      draftNote + optional nullable metadata;
#                      GET /audit/{id} serves the read view;
#   (c) SyncedRecord — mixes readOnly AND writeOnly (one direction lossless,
#                      the other not); PUT /synced carries a constrained kept
#                      field (label minLength) so the Write view emits and the
#                      router calls validate_request;
#   (d) PlainNote    — no markers at all: NO view types emitted (identity).
openapi: 3.1.0
info:
  title: directional-views
  version: "1"
paths:
  /accounts:
    post:
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Account'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
  /audit/{id}:
    get:
      operationId: listAuditEntries
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEntry'
  /synced:
    put:
      operationId: syncRecord
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncedRecord'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncedRecord'
components:
  schemas:
    Account:
      type: object
      required: [id, password]
      properties:
        id:
          type: string
        password:
          type: string
          writeOnly: true
        note:
          type: string
    AuditEntry:
      type: object
      required: [createdAt]
      properties:
        createdAt:
          type: string
          readOnly: true
        draftNote:
          type: string
          writeOnly: true
        metadata:
          type: [string, 'null']
    SyncedRecord:
      type: object
      required: [id, label]
      properties:
        id:
          type: string
          readOnly: true
        label:
          type: string
          minLength: 3
        secretToken:
          type: string
          writeOnly: true
        reviewedBy:
          type: string
          readOnly: true
    PlainNote:
      type: object
      required: [title]
      properties:
        title:
          type: string
        body:
          type: string

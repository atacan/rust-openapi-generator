# Fixture 16 — Phase 4 optional codec families (main spec §5.9, §45;
# DECISIONS.md D-impl-codec-plugins). Every operation below uses a media type
# that the default classifier leaves in the §5.9 raw-streaming fallback:
# generation is CONFIG-dependent. Without an enabled codec these entries stay
# raw streaming; enabling `xml` / `cbor` / `msgpack` in the generator plan
# options claims the corresponding entries and turns BOTH directions typed
# (bounded collect + codec parse, bounded encode through the fail-fast
# counting writer).
#
# Schemas are deliberately enum-free objects with string/int fields:
# enum wire forms are codec-specific (quick-xml has no externally visible
# variant tagging contract, and rmp-serde/ciborium encode serde variants
# differently), so they are a documented codec limitation for this phase.
# Each schema also carries ONE runtime-validated constraint (`minLength` on
# its required string) so companion §9 post-decode validation stays provable
# on codec paths too: a well-formed payload violating the constraint must
# yield SchemaViolation 422 AFTER the codec decode, while codec data errors
# map onto MalformedBody 400 (main spec §50 test 52; §39 Codec exception).
# Each operation also documents problem+json on 400 so malformed-body tests
# observe the §39 MalformedBody mapping through the documented enum.
openapi: 3.1.0
info:
  title: codecs
  version: "1"
paths:
  /xml/documents:
    post:
      operationId: createXmlDocument
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/XmlDocument'
      responses:
        '201':
          description: Stored document echoed back as XML
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/XmlDocument'
        '400':
          description: Malformed request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /cbor/state:
    put:
      operationId: putCborState
      requestBody:
        required: true
        content:
          application/cbor:
            schema:
              $ref: '#/components/schemas/CborState'
      responses:
        '200':
          description: Current state as CBOR
          content:
            application/cbor:
              schema:
                $ref: '#/components/schemas/CborState'
        '400':
          description: Malformed request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /msgpack/events:
    post:
      operationId: postMsgPackEvent
      requestBody:
        required: true
        content:
          application/msgpack:
            schema:
              $ref: '#/components/schemas/MsgPackEvent'
      responses:
        '200':
          description: Acknowledgement as MessagePack
          content:
            application/msgpack:
              schema:
                $ref: '#/components/schemas/MsgPackEvent'
        '400':
          description: Malformed request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /json/echo:
    post:
      operationId: echoJson
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonPing'
      responses:
        '200':
          description: Plain JSON echo (ForceStreaming override target)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonPing'
        '400':
          description: Malformed request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  schemas:
    XmlDocument:
      type: object
      required: [title, revision]
      properties:
        title:
          type: string
          minLength: 2
        revision:
          type: integer
          format: int32
    CborState:
      type: object
      required: [slot, level]
      properties:
        slot:
          type: string
          minLength: 2
        level:
          type: integer
          format: int64
    MsgPackEvent:
      type: object
      required: [kind, seq]
      properties:
        kind:
          type: string
          minLength: 2
        seq:
          type: integer
          format: int32
    JsonPing:
      type: object
      required: [message]
      properties:
        message:
          type: string
        code:
          type: integer
          format: int32
    ProblemDetails:
      type: object
      required: [title]
      properties:
        title:
          type: string

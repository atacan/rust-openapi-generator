[package]
name = "openapi-to-rust-generator"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "oapi-to-rust"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
thiserror = "2"
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"

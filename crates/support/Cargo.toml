[package]
name = "openapi-support"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lints.rust]
unsafe_code = "forbid"

[features]
default = []
client = ["dep:reqwest", "dep:hyper", "dep:tokio", "dep:tokio-util", "dep:futures-util"]
server = ["dep:axum", "dep:tokio", "dep:tokio-util", "dep:futures-util"]
# §30.2 transparent response decompression. Each implies `client` because
# content coding only ever applies to the Reqwest response path — enabling a
# bare compression feature without the client stack would silently pull
# reqwest while nothing could use it. The reqwest feature names are the
# upstream ones verbatim (`gzip`/`brotli`/`zstd`; there is no `client-…`
# spelling on the reqwest side).
client-gzip = ["client", "reqwest/gzip"]
client-br = ["client", "reqwest/brotli"]
client-zstd = ["client", "reqwest/zstd"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
mime = { workspace = true }
thiserror = "2"
futures-core = { workspace = true }

reqwest = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
futures-util = { workspace = true }

[workspace]
resolver = "2"
members = ["crates/support", "crates/generator", "crates/conformance"]

[workspace.package]
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]
async-trait = "0.1"
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream"] }
http = "1"
hyper = "1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mime = "0.3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-core = "0.3"
futures-util = "0.3"
tower = { version = "0.5", features = ["util"] }
serde_yaml = "0.9"
# Optional media-codec families (main spec §45): runtime deps of GENERATED
# crates only — openapi-support stays dependency-light
# (DECISIONS.md D-impl-codec-plugins). quick-xml is held to the 0.41 minor:
# 0.42 raised its MSRV past the workspace's 1.85 floor.
quick-xml = { version = "0.41", features = ["serialize"] }
ciborium = "0.2"
rmp-serde = "1.3"

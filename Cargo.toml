[workspace]
resolver = "2"
members = [
    "crates/support",
    "crates/generator",
    "crates/conformance",
    "examples/kitchen-sink/models",
    "examples/kitchen-sink/client",
    "examples/kitchen-sink/server",
    "examples/large-upload/models",
    "examples/large-upload/client",
    "examples/large-upload/server",
]

[workspace.package]
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]
async-trait = "0.1"
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream"] }
http = "1"
hyper = "1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mime = "0.3"
    # `time` backs the §31 replay-twin backoff sleeps
    # (::openapi_support::retry); DECISIONS D-impl-retry. `net` backs the
    # §30.2/§50-t32 decoded-byte-limit proof, which serves a gzipped body over
    # a hermetic loopback socket from inside openapi-support's test suite.
    tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-core = "0.3"
futures-util = "0.3"
tower = { version = "0.5", features = ["util"] }
# Compile-fail fixtures (§50 test 38's negative half). Held to <1.0.120:
# trybuild 1.0.120 raised its rust-version to 1.88, past the workspace's
# pinned MSRV tuple of 1.85 (main spec §3.1), so the exact 1.85-compatible
# minor stays locked here.
trybuild = "=1.0.119"
serde_yaml = "0.9"
# Optional media-codec families (main spec §45): runtime deps of GENERATED
# crates only — openapi-support stays dependency-light
# (DECISIONS.md D-impl-codec-plugins). quick-xml is held to the 0.41 minor:
# 0.42 raised its MSRV past the workspace's 1.85 floor.
quick-xml = { version = "0.41", features = ["serialize"] }
ciborium = "0.2"
rmp-serde = "1.3"
# Demo-only measurement dependencies of the large-upload example (not part
# of any emitted manifest): sha2 — incremental digest proving the full
# payload was handled; memory-stats — cross-platform sampled RSS;
# libc — getrusage(2) kernel high-water mark (ru_maxrss).
sha2 = "0.10"
memory-stats = "1.2"
libc = "0.2"
